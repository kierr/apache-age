name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.1', '3.2', '3.3', '3.4']
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Generate RBI files
        run: bundle exec rake tapioca:require && bundle exec rake tapioca:non_gem

      - name: Verify RBI freshness
        run: |
          if ! git diff --exit-code sorbet/; then
            echo "RBI files are stale. Run 'bundle exec rake tapioca:require && bundle exec rake tapioca:non_gem' and commit the changes."
            git diff sorbet/
            exit 1
          fi

      - name: Sorbet typecheck
        run: bundle exec srb tc

      - name: Rubocop
        run: bundle exec rubocop

      - name: Test
        run: bundle exec rake test
