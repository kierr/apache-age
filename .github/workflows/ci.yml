name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write
  security-events: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.3', '3.4', '4.0']
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: RuboCop
        run: bundle exec rubocop

      - name: Test with coverage
        run: bundle exec rake test

      - name: Upload coverage report
        if: matrix.ruby == '4.0' && always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report-ruby-${{ matrix.ruby }}
          path: coverage/
          retention-days: 7

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true

      # RATIONALE: RBI verify removed from CI — tapioca gem regeneration
      # depends on exact gem versions resolved per platform, which drifts
      # between local (macOS arm64) and CI (Linux x86_64). Verify locally
      # before committing with `bundle exec rake sorbet:rbi_verify`.
      # Would need a shared gem-resolution environment to reconsider.

      - name: Sorbet typecheck
        run: bundle exec rake sorbet:tc

      - name: Spoom typed coverage
        run: bundle exec rake sorbet:metrics
