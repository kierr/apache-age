services:
  postgres:
    image: apache/age:release_PG17_1.7.0
    environment:
      POSTGRES_USER: age_user
      POSTGRES_PASSWORD: age_pass
      POSTGRES_DB: age_test
    ports:
      - '127.0.0.1:5434:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U age_user -d age_test"]
      interval: 5s
      timeout: 5s
      retries: 5
